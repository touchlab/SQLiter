name: build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ macOS-latest, windows-latest, ubuntu-latest ]
    runs-on: ${{matrix.os}}
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install msys2
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-sqlite3
          release: false

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Update Environment Variables
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          echo "c:\msys64\mingw64\bin" >> $GITHUB_PATH

      - name: Build
        if: matrix.os != 'macOS-latest'
        run: ./gradlew build --no-daemon --stacktrace

      - name: Build and Test
        if: matrix.os == 'macOS-latest'
        run: ./gradlew build allTests --no-daemon --stacktrace
env:
  GRADLE_OPTS: -Dorg.gradle.configureondemand=true -Dkotlin.incremental=false -Dorg.gradle.jvmargs="-Xmx4g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=512m"
